name: Upstream Sync & Container Build

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync:
    name: Sync with Original Repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      has_changes: ${{ steps.sync-check.outputs.has_changes }}
      upstream_sha: ${{ steps.sync-check.outputs.upstream_sha }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true
          fetch-depth: 0

      - name: Configure Git Identity
        run: |
          git config user.name "${{ vars.COMMIT_USER_NAME }}"
          git config user.email "${{ vars.COMMIT_USER_EMAIL }}"

      - name: Fetch and Merge Upstream Updates
        id: sync-check
        run: |
          git remote add upstream "${{ vars.UPSTREAM_REPO_URL }}"
          git fetch upstream "${{ vars.UPSTREAM_BRANCH }}"

          if ! git log "${{ github.ref_name }}..upstream/${{ vars.UPSTREAM_BRANCH }}" --oneline | grep -q .; then
            echo "No new updates found upstream. Skipping build cycle."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "New updates found upstream! Merging code streams..."

          UPSTREAM_SHA=$(git rev-parse --short=8 "upstream/${{ vars.UPSTREAM_BRANCH }}")
          echo "Upstream commit: $UPSTREAM_SHA"
          echo "upstream_sha=$UPSTREAM_SHA" >> "$GITHUB_OUTPUT"

          # Save the fork's README so it can be restored exactly after the merge.
          cp README.md /tmp/README.md

          # Perform the merge without automatically creating the commit.
          if git merge "upstream/${{ vars.UPSTREAM_BRANCH }}" --no-edit --no-commit; then
            echo "Upstream merge completed without conflicts."
          else
            echo "Merge conflict detected."

            # README.md is the only file intentionally customized in both repositories.
            if git diff --name-only --diff-filter=U | grep -qx "README.md"; then
              echo "README.md conflict detected. Keeping the fork's README.md."
              git checkout --ours README.md
              git add README.md
            fi

            # Do not silently ignore conflicts in any other files.
            if git diff --name-only --diff-filter=U | grep -q .; then
              echo "Unresolved merge conflicts remain:"
              git diff --name-only --diff-filter=U
              exit 1
            fi
          fi

          # Always restore the exact README.md from the fork.
          cp /tmp/README.md README.md
          git add README.md

          # Create the merge commit.
          if git diff --cached --quiet; then
            git commit --no-edit
          else
            git commit --no-edit
          fi

          git push origin "${{ github.ref_name }}"
          echo "has_changes=true" >> "$GITHUB_OUTPUT"

  build:
    name: Compile and Push to GHCR
    needs: sync
    if: ${{ needs.sync.outputs.has_changes == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Merged Codebase
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - name: Log into GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata (Tags/Labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ vars.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=upstream-${{ needs.sync.outputs.upstream_sha }},enable=${{ needs.sync.outputs.upstream_sha != '' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          provenance: false
          oci-mediatypes: false
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}